name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 最小改动：先只留 3.12 两格。绿了之后再逐行加回 3.10 / 3.13。
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Byte-compile package
        run: python -m compileall -q pc_cleaner

      - name: Run tests
        run: python -m pytest -q

      - name: Version smoke test
        run: python -m pc_cleaner --version

      - name: Validate rules.json
        run: python -m pc_cleaner --validate-rules

      - name: Health JSON contract smoke test
        run: |
          python -m pc_cleaner --health --json > health.json
          python -c "import json,pathlib;d=json.loads(pathlib.Path('health.json').read_text(encoding='utf-8'));assert isinstance(d,dict);assert all(k in d for k in ('schema_version','ok','status','exit_code','health'));items=d['health']['items'];assert isinstance(items,list) and items;print('health json ok: status=%s items=%d' % (d['status'],len(items)))"
