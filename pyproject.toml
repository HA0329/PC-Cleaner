[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-junk-cleaner"
version = "0.9.18"
description = "为个人电脑定制的安全垃圾清理工具 (Windows 优先)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "you" }]
# v0.9.10：**只支持 Python 3.12+**。
# 原因：代码里使用 PEP 701 的 f-string 写法（``f"{dim(f'…')}"`` —— 内层 f-string
# 用与外层相同的引号），这在 3.10/3.11 上是**语法错误**，报错还是让人完全摸不着
# 头脑的 "unterminated string literal"。与其在旧解释器上崩栈，不如把要求写清楚：
# 安装阶段 pip 直接拒绝，启动阶段 ``_launcher.py`` / ``__main__.py`` 给中文提示。
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
keywords = ["cleaner", "junk", "cache", "windows", "pc", "garbage", "maintenance"]

# v0.9.3：send2trash 改为**必需依赖**。
# 此前它是可选 extra，未安装时工具会静默降级为永久删除，
# 与「安全第一 / 可撤销」的产品定位矛盾（默认进回收站才可恢复）。
dependencies = ["send2trash>=1.8"]

[project.optional-dependencies]
# 兼容旧写法：send2trash 已是必需依赖，此 extra 保留为空
recycle = []
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.10"]
all = ["pytest>=7", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
pc-junk-cleaner = "pc_cleaner.cli:main"

[tool.setuptools.packages.find]
include = ["pc_cleaner*"]

[tool.setuptools.package-data]
pc_cleaner = ["rules.json", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["pc_cleaner", "tests"]

[tool.ruff.lint]
# 只用一组稳定、低争议的规则：语法错误 / 未使用 / 导入顺序 / 常见 bug。
# 格式类规则（E501、引号、缩进）不在这里强制，避免把历史代码一次性全重排。
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# __main__.py 必须在导入 cli 之前完成 Python 版本 / Windows 平台门禁。
"pc_cleaner/__main__.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
# 本工具只适配 Windows；强制按 win32 解析 msvcrt / winreg 等平台模块。
platform = "win32"
files = ["pc_cleaner"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
