[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-junk-cleaner"
version = "0.9.10"
description = "为个人电脑定制的安全垃圾清理工具 (Windows 优先)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "you" }]
# v0.9.10：**只支持 Python 3.12+**。
# 原因：代码里使用 PEP 701 的 f-string 写法（``f"{dim(f'…')}"`` —— 内层 f-string
# 用与外层相同的引号），这在 3.10/3.11 上是**语法错误**，报错还是让人完全摸不着
# 头脑的 "unterminated string literal"。与其在旧解释器上崩栈，不如把要求写清楚：
# 安装阶段 pip 直接拒绝，启动阶段 ``_launcher.py`` / ``__main__.py`` 给中文提示。
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
keywords = ["cleaner", "junk", "cache", "windows", "pc", "garbage", "maintenance"]

# v0.9.3：send2trash 改为**必需依赖**。
# 此前它是可选 extra，未安装时工具会静默降级为永久删除，
# 与「安全第一 / 可撤销」的产品定位矛盾（默认进回收站才可恢复）。
dependencies = ["send2trash>=1.8"]

[project.optional-dependencies]
# 兼容旧写法：send2trash 已是必需依赖，此 extra 保留为空
recycle = []
dev = ["pytest>=7"]
all = ["pytest>=7"]

[project.scripts]
pc-junk-cleaner = "pc_cleaner.cli:main"

[tool.setuptools.packages.find]
include = ["pc_cleaner*"]

[tool.setuptools.package-data]
pc_cleaner = ["rules.json", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
