[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-junk-cleaner"
version = "0.1.0"
description = "为个人电脑定制的安全垃圾清理工具 (Windows 优先)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "you" }]
requires-python = ">=3.10"
keywords = ["cleaner", "junk", "cache", "windows", "pc", "garbage"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

dependencies = []

[project.optional-dependencies]
# 删除到回收站（可恢复，推荐）。未安装时自动降级为永久删除并提示。
recycle = ["send2trash>=1.8"]
dev = ["pytest>=7"]
all = ["send2trash>=1.8", "pytest>=7"]

[project.scripts]
pc-junk-cleaner = "pc_cleaner.cli:main"

[tool.setuptools.packages.find]
include = ["pc_cleaner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
